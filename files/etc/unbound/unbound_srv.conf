# Local-zone answers migrated from the Pi's kresd (pi-tuning/dns conf.d/).
# Only the *answering* moved here -- the services these hostnames point at
# (nginx reverse-proxy, the WireGuard endpoint) still live on the Pi at
# 192.168.1.6, unchanged. Included into unbound's `server:` clause by the
# unbound OpenWrt package's "Hybrid Manual/UCI" mechanism (see
# net/unbound/files/README.md).

# reverse-proxy: resolve the whole *.home zone to the Pi so nginx's
# name-based vhosts work network-wide. "redirect" answers every name under
# home. (the zone itself and every subdomain) with this one record, matching
# the Pi's former policy.suffix(policy.ANSWER(...)) behavior exactly.
local-zone: "home." redirect
local-data: "home. A 192.168.1.6"

# wireguard-opts: answer the WireGuard IPv4 endpoint hostname with the Pi's
# own LAN address for LAN-local clients, so a phone on the home Wi-Fi dials
# it directly instead of round-tripping through the router's WAN NAT
# hairpin. A single exact name, not a zone, so "static" (exact-match only)
# is correct here -- unlike home. above, nothing else lives under this name.
local-zone: "vpn.myhomevpn.fyi." static
local-data: "vpn.myhomevpn.fyi. A 192.168.1.6"

# rax70-telemetry-block: the RAX70 (repeater off this router) runs ASUS's
# always-on AAE cloud relay (aaews/awsiot), which tries to hold a
# persistent tunnel to *.asuscomm.com regardless of whether any ASUS
# account/Alexa/IFTTT feature is configured. The actual block is a static
# iptables OUTPUT drop on the RAX70 itself (jffs/scripts/services-start,
# since aaews reconnects to a cached IP without a fresh DNS lookup and
# doesn't respect this alone) -- this local-zone is defense-in-depth so a
# first-time/rotated-IP resolution attempt fails closed instead of
# succeeding. "static" with no local-data returns NXDOMAIN for the zone
# and everything under it.
local-zone: "asuscomm.com." static

# orbispatches-cdn-allow: orbispatches.com only lists patches; the .pkg
# links it hands out point at Sony's patch CDN, which sits under the
# playstation.net zone that adblock.blocklist blocks wholesale. A more
# specific local-zone wins over adblock's always_nxdomain on the parent, and
# "transparent" with no local-data resolves these names normally. Everything
# else under playstation.net (firmware update hosts etc.) stays NXDOMAIN.
local-zone: "gs2.ww.prod.dl.playstation.net." transparent
local-zone: "gs-sec.ww.np.dl.playstation.net." transparent
